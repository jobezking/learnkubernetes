apiVersion: v1
kind: Service
metadata:
  name: vote
  labels:
    app: vote
spec:
  type: NodePort  #external  for cloud would be LoadBalancer
  ports:
  - name: "vote-service"
    port: 8080     # service port that other pods will use to connect to voting-app; service will forward to targetPort
    targetPort: 80  # port for nodejs container app
    nodePort: 31000 # tells nodes in k8s cluster what port they should listen on in order to forward traffic to vote-service. 
                    # external port that browsers connect to
  selector:
    app: vote