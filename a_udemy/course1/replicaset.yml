apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: myapp-replicaset
  labels:
    app: myapp
    type: front-end
spec:
  replicas: 3
  template:
    metadata:
      name: myapp-pod
      labels:
        app: myapp
        type: front-end
    spec:
      containers:
      - name: nginx-container
        image: nginx:latest
  selector:
    matchLabels:
      type: front-end 

# kubectl apply -f replicaset.yml
# kubectl get replicaset or kubectl get rs
# kubectl get pods
# kubectl get pods -l type=front-end