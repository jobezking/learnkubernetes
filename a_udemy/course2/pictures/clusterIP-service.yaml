apiVersion: v1
kind: Service
metadata:
  name: myapp-service
spec:
  type: ClusterIP
  ports:
   - port: 80          # port running on service. Communicates between service and pod
     targetPort: 80    # port running on the pod i.e. on apache2 container
  selector:    # from pod metadata.labels
    app: myapp
    type: front-end