apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-sa
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-dashboard-deployment
  namespace: default
  labels:
    app: flask-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-dashboard
  template:
    metadata:
      labels:
        app: flask-dashboard
    spec:
      serviceAccountName: dashboard-sa
      containers:
      - name: flask-app
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install flask gunicorn && \
            cat << 'EOF' > app.py
            from flask import Flask
            app = Flask(__name__)

            @app.route('/')
            def health():
                return "Dashboard App is running!", 200

            if __name__ == '__main__':
                app.run(host='0.0.0.0', port=5000)
            EOF
            gunicorn --bind 0.0.0.0:5000 app:app
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20