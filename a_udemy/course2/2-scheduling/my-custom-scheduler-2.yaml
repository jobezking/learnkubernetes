apiVersion: v1
kind: Pod
metadata: 
  name: my-custom-scheduler-2
  namespace: kube-system
spec:
  containers:
  - command:
    - kube-scheduler
    - --address=127.0.0.1
    - --kubeconfig=/etc/kubernetes/scheduler.conf
    - --config=/etc/kubernetes/config/my-scheduler-2.yaml
    image: k8s.gcr.io/kube-scheduler:v1.20.0
    name: kube-scheduler